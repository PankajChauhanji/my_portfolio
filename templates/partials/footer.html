{% from 'partials/icons.html' import icon, social_icon %}
<footer class="site-footer">
  <div class="container footer-inner">
    <p>&copy; {{ year }} {{ profile.name }} · {{ site.footer_note }}</p>
    <div class="footer-links">
      {% for s in profile.social %}
      <a href="{{ s.href }}" class="icon-btn" aria-label="{{ s.label }}"{% if s.type != 'email' %} target="_blank" rel="noopener me"{% endif %}>{{ social_icon(s.label) }}</a>
      {% endfor %}
    </div>
  </div>
</footer>
