{% from 'partials/icons.html' import icon %}
{% if site.features.contact and site.contact.enabled %}
<div id="contact-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="contact-title">
  <div class="card modal-card">
    <button id="contact-close" type="button" class="icon-btn modal-close" aria-label="Close">{{ icon('x') }}</button>
    <p class="eyebrow">Contact</p>
    <h2 id="contact-title" class="h2" style="font-size:1.8rem">{{ site.contact.heading }}</h2>
    <p class="muted" style="margin:8px 0 0">{{ site.contact.subtitle }}</p>
    <form id="contact-form" class="form" novalidate
          data-provider="{{ site.contact.provider }}" data-to="{{ site.contact.to_email }}"
          data-key="{{ site.contact.web3forms_access_key }}" data-success="{{ site.contact.success_message }}">
      <div><label for="cf-email">Email</label><input id="cf-email" name="email" type="email" required autocomplete="email" placeholder="you@company.com"></div>
      <div><label for="cf-phone">Phone <em>(optional)</em></label><input id="cf-phone" name="phone" type="tel" autocomplete="tel" placeholder="+91 …"></div>
      <div><label for="cf-subject">Subject</label><input id="cf-subject" name="subject" type="text" placeholder="Let's talk about…"></div>
      <div><label for="cf-message">Message</label><textarea id="cf-message" name="message" rows="4" required placeholder="What are you building?"></textarea></div>
      <button type="submit" id="cf-submit" class="btn btn-primary" style="width:100%">Send message</button>
      <p id="cf-status" class="form-status hidden" role="status"></p>
    </form>
  </div>
</div>
{% endif %}
