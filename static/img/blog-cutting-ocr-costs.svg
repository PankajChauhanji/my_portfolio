<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1120"/>
      <stop offset="0.55" stop-color="#111a33"/>
      <stop offset="1" stop-color="#1b1240"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4ade80"/>
      <stop offset="1" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#cbd5e1"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <marker id="arw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8ba0c7"/>
    </marker>
    <marker id="arwG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#34d399"/>
    </marker>
  </defs>

  <!-- background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- faint decorative rings, top-right -->
  <g fill="none" stroke="#3b4a7a" stroke-opacity="0.25" stroke-width="1.5">
    <circle cx="1080" cy="90" r="60"/><circle cx="1080" cy="90" r="110"/><circle cx="1080" cy="90" r="165"/>
  </g>
  <g fill="#33406b" fill-opacity="0.35">
    <circle cx="150" cy="560" r="2.5"/><circle cx="200" cy="580" r="2.5"/><circle cx="250" cy="560" r="2.5"/>
    <circle cx="1050" cy="540" r="2.5"/><circle cx="1100" cy="560" r="2.5"/>
  </g>

  <!-- kicker -->
  <rect x="72" y="54" width="360" height="32" rx="16" fill="#1e293b" stroke="#3b4a7a" stroke-width="1.2"/>
  <circle cx="92" cy="70" r="5" fill="url(#green)"/>
  <text x="108" y="75" font-size="14" font-weight="700" fill="#9fb3d8" letter-spacing="1.5">COST OPTIMIZATION · ocr_kit PIPELINE</text>

  <!-- headline -->
  <text x="72" y="146" font-size="50" font-weight="800" fill="#f1f5f9">Two fronts. <tspan fill="#4ade80">One smaller bill.</tspan></text>
  <text x="72" y="186" font-size="20" fill="#93a4c4">Page merging collapses the API calls — a streamed pipeline flattens the RAM, CPU &amp; latency underneath them.</text>

  <!-- ================= FRONT 1: FEWER CALLS ================= -->
  <text x="72" y="242" font-size="15" font-weight="800" fill="#60a5fa" letter-spacing="0.5">① FEWER CALLS  ·  page merging</text>

  <!-- 6 page cards (a document) -->
  <g filter="url(#soft)">
    <rect x="82" y="262" width="66" height="22" rx="3" fill="url(#page)"/>
    <rect x="82" y="288" width="66" height="22" rx="3" fill="url(#page)"/>
    <rect x="82" y="314" width="66" height="22" rx="3" fill="url(#page)"/>
    <rect x="82" y="340" width="66" height="22" rx="3" fill="url(#page)"/>
    <rect x="82" y="366" width="66" height="22" rx="3" fill="url(#page)"/>
    <rect x="82" y="392" width="66" height="22" rx="3" fill="url(#page)"/>
  </g>
  <text x="115" y="436" font-size="13" font-weight="700" fill="#94a3b8" text-anchor="middle">6 pages</text>

  <!-- converging merge lines -->
  <g stroke="#60a5fa" stroke-width="1.6" fill="none" opacity="0.85">
    <path d="M150,273 C185,273 205,330 232,336"/>
    <path d="M150,299 C185,299 210,332 232,337"/>
    <path d="M150,325 L232,337"/>
    <path d="M150,351 L232,339"/>
    <path d="M150,377 C185,377 210,344 232,340"/>
    <path d="M150,403 C185,403 205,346 232,341"/>
  </g>
  <circle cx="234" cy="338" r="5" fill="#60a5fa"/>
  <path d="M244,338 L286,338" stroke="#8ba0c7" stroke-width="2" marker-end="url(#arw)"/>

  <!-- one merged tall page -->
  <g filter="url(#soft)">
    <rect x="292" y="278" width="58" height="120" rx="5" fill="url(#page)"/>
  </g>
  <g stroke="#94a3b8" stroke-width="1.4" opacity="0.6">
    <line x1="302" y1="336" x2="340" y2="336"/>
  </g>
  <text x="321" y="418" font-size="12" font-weight="700" fill="#94a3b8" text-anchor="middle">1 image</text>

  <path d="M358,338 L392,338" stroke="#34d399" stroke-width="2" marker-end="url(#arwG)"/>

  <!-- API call chip -->
  <rect x="398" y="316" width="132" height="44" rx="10" fill="#0f2a22" stroke="#10b981" stroke-width="1.6"/>
  <text x="464" y="337" font-size="14" font-weight="800" fill="#4ade80" text-anchor="middle">1 API CALL</text>
  <text x="464" y="352" font-size="10.5" fill="#6ee7b7" text-anchor="middle">was 6 · pay once</text>

  <!-- ================= BIG RESULT: 80% ================= -->
  <rect x="566" y="238" width="562" height="150" rx="18" fill="#0e1830" stroke="#2b3a63" stroke-width="1.5"/>
  <text x="606" y="352" font-size="104" font-weight="800" fill="url(#green)" filter="url(#glow)">80%</text>
  <path d="M602,300 l0,44 m-13,-16 l13,16 l13,-16" stroke="#4ade80" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" transform="translate(-24,0)"/>
  <text x="830" y="308" font-size="24" font-weight="800" fill="#e2e8f0">lower OCR spend</text>
  <text x="830" y="336" font-size="15" fill="#93a4c4">fewer vendor API calls —</text>
  <text x="830" y="357" font-size="15" fill="#93a4c4">matched the theoretical max in production.</text>

  <!-- ================= FRONT 2: CHEAPER TO RUN ================= -->
  <text x="72" y="452" font-size="15" font-weight="800" fill="#34d399" letter-spacing="0.5">②  …AND CHEAPER TO PRODUCE EACH CALL  ·  streamed pipeline</text>

  <!-- chip 1: RAM flat -->
  <rect x="72" y="466" width="336" height="100" rx="14" fill="#111c34" stroke="#2b3a63" stroke-width="1.4"/>
  <text x="96" y="498" font-size="13" font-weight="800" fill="#7f9bd0" letter-spacing="1">PEAK RAM</text>
  <text x="96" y="524" font-size="19" font-weight="800" fill="#f1f5f9">Flat at any size</text>
  <text x="96" y="546" font-size="12.5" fill="#8ea3c6">constant from 2 to 500 pages</text>
  <polyline points="300,540 320,540 340,540 360,540 384,540" fill="none" stroke="#4ade80" stroke-width="3" stroke-linecap="round"/>
  <circle cx="384" cy="540" r="3.5" fill="#4ade80"/>

  <!-- chip 2: CPU down -->
  <rect x="432" y="466" width="336" height="100" rx="14" fill="#111c34" stroke="#2b3a63" stroke-width="1.4"/>
  <text x="456" y="498" font-size="13" font-weight="800" fill="#7f9bd0" letter-spacing="1">CPU</text>
  <text x="456" y="524" font-size="19" font-weight="800" fill="#f1f5f9">Cut the wasted work</text>
  <text x="456" y="546" font-size="12.5" fill="#8ea3c6">−20× on a denoiser that changed nothing</text>
  <g fill="#4ade80"><rect x="700" y="512" width="9" height="28" rx="2"/><rect x="714" y="522" width="9" height="18" rx="2"/><rect x="728" y="530" width="9" height="10" rx="2"/></g>
  <path d="M700,508 L738,528" stroke="#34d399" stroke-width="2.4" fill="none" marker-end="url(#arwG)"/>

  <!-- chip 3: latency down -->
  <rect x="792" y="466" width="336" height="100" rx="14" fill="#111c34" stroke="#2b3a63" stroke-width="1.4"/>
  <text x="816" y="498" font-size="13" font-weight="800" fill="#7f9bd0" letter-spacing="1">LATENCY</text>
  <text x="816" y="524" font-size="19" font-weight="800" fill="#f1f5f9">Fewer, parallel calls</text>
  <text x="816" y="546" font-size="12.5" fill="#8ea3c6">6 round-trips → 1, run concurrently</text>
  <path d="M1058,516 C1072,516 1076,538 1092,538" stroke="#4ade80" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M1092,538 l-2,-11 m2,11 l9,-6" stroke="#4ade80" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- footer -->
  <text x="72" y="606" font-size="13" fill="#5f6f92">The API had no idea it was there. The only systems that noticed were the invoice and the memory graph.</text>
  <text x="1128" y="606" font-size="13" font-weight="700" fill="#7f9bd0" text-anchor="end">pankajchauhan · ocr_kit</text>
</svg>
